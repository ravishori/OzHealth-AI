# HN-INFRA-009 — CI build/test (no deploy, no production secrets)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings requires these at import time. Placeholders only — tests mock DB/IO.
      # Do not replace with production credentials.
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
      SYNC_DATABASE_URL: postgresql+psycopg2://ci:ci@127.0.0.1:5432/ci
      SECRET_KEY: ci-only-secret-key-not-for-production
      ENCRYPTION_KEY: ""
      ANTHROPIC_API_KEY: ""
      EPRESCRIPTION_MOCK_MODE: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  flutter:
    name: Flutter (test + analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze
