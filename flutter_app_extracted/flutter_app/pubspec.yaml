name: vitapulse_ai
description: VitaPulse AI - Intelligent Personal Health Companion for Australia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/